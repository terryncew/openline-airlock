[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openline-airlock"
version = "0.1.0"
description = "Let coding agents work your backlog without turning every attempt into a PR you have to review."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "OpenLine"}]
keywords = ["coding-agents", "autonomous-coding", "ci", "verification", "git"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
airlock = "airlock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
