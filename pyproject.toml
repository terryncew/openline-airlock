[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openline-airlock"
version = "0.2.1"
description = "Turn machine attempts into software improvements without turning them into review debt."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "OpenLine"}]
keywords = ["coding-agents", "open-source", "pull-requests", "ci", "verification", "git"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
airlock = "airlock.cli:main"
airlock-submit = "airlock_submit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
