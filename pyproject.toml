[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openline-airlock"
version = "0.4.0"
description = "Turn machine attempts into software improvements without turning them into review debt."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "OpenLine"}]
keywords = ["coding-agents", "open-source", "pull-requests", "ci", "verification", "git"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
airlock = "airlock.command:main"
airlock-submit = "airlock_submit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airlock = ["ci_rules.v1.json", "ci_receipt.v1.schema.json"]
