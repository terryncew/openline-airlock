name: AIRLOCK-SEARCH-001B

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/airlock-search-001b.yml"

permissions:
  contents: read

concurrency:
  group: airlock-search-001b
  cancel-in-progress: false

env:
  SELF_SUBSTRATE: 91861c77e4b03ace60df147b0accf94f4351de18
  HERMES_COMMIT: 29112bef099274229cadff79cdff7bf7b99c4b77
  HERMES_MODEL: gpt-5.6-sol
  HERMES_HOME: /tmp/search-001b-hermes-home
  HERMES_INSTALL_DIR: /tmp/search-001b-hermes

jobs:
  preregistration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - name: Check frozen hidden evaluator
        run: python experiments/airlock-search-001b/evaluate.py --repo . --self-check
      - name: Check public opportunity filter
        run: python experiments/airlock-search-001b/selector_power_check.py

  generate:
    needs: preregistration
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require model credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: 'test -n "${OPENAI_API_KEY:-}"'
      - run: python -m pip install .
      - name: Install exact Hermes CLI
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$HERMES_HOME" "$HERMES_INSTALL_DIR"
          mkdir -p "$HERMES_HOME" "$HERMES_INSTALL_DIR"
          ARCHIVE="$RUNNER_TEMP/hermes-$HERMES_COMMIT.tar.gz"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_READ_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/NousResearch/hermes-agent/tarball/$HERMES_COMMIT" -o "$ARCHIVE"
          test -s "$ARCHIVE"
          tar -xzf "$ARCHIVE" --strip-components=1 -C "$HERMES_INSTALL_DIR"
          python -m venv "$HERMES_INSTALL_DIR/venv"
          "$HERMES_INSTALL_DIR/venv/bin/python" -m pip install --disable-pip-version-check --editable "$HERMES_INSTALL_DIR"
          test -x "$HERMES_INSTALL_DIR/venv/bin/hermes"
          mkdir -p "$RUNNER_TEMP/hermes-bin"
          ln -sf "$HERMES_INSTALL_DIR/venv/bin/hermes" "$RUNNER_TEMP/hermes-bin/hermes"
          echo "$RUNNER_TEMP/hermes-bin" >> "$GITHUB_PATH"
      - name: Prepare isolated Hermes home
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" > "$HERMES_HOME/.env"
          cat > "$HERMES_HOME/config.yaml" <<EOF
          model:
            provider: openai-api
            default: $HERMES_MODEL
          terminal:
            backend: local
            cwd: "."
            timeout: 180
          approvals:
            mode: off
          agent:
            max_turns: 90
          EOF
          chmod 600 "$HERMES_HOME/.env" "$HERMES_HOME/config.yaml"
      - name: Find measured opportunities and build candidates
        run: |
          mkdir -p "$RUNNER_TEMP/search-001b"
          python experiments/airlock-search-001b/generate.py             --source-repo .             --out "$RUNNER_TEMP/search-001b/bundle.json"
      - uses: actions/upload-artifact@v4
        with:
          name: SEARCH-001B-CANDIDATES
          path: ${{ runner.temp }}/search-001b/bundle.json
          if-no-files-found: error
          retention-days: 30

  evaluate:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: SEARCH-001B-CANDIDATES
          path: ${{ runner.temp }}/search-001b
      - name: Run unchanged hidden evaluator
        run: |
          mkdir -p "$RUNNER_TEMP/search-001b-result"
          python experiments/airlock-search-001b/evaluate.py             --repo .             --bundle "$RUNNER_TEMP/search-001b/bundle.json"             --out "$RUNNER_TEMP/search-001b-result/SEARCH-001B-result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: AIRLOCK-SEARCH-001B-result
          path: ${{ runner.temp }}/search-001b-result/SEARCH-001B-result.json
          if-no-files-found: error
          retention-days: 90
