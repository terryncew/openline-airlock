name: RIL-ANOMALY-002 isolated earned lesson ratchet

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ril-anomaly-002.yml"
      - "experiments/ril-anomaly-002/**"
      - "proofs/ril-anomaly-001/**"
      - "proofs/ril-isolation-002/**"
      - "proofs/ril-rank-live-002/**"

permissions:
  contents: read

jobs:
  instrument:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Verify predecessor chain and current lineage
        run: python experiments/ril-anomaly-002/run_ril_anomaly_002.py verify-repo
      - name: Verify experiment instrument power
        run: python experiments/ril-anomaly-002/run_ril_anomaly_002.py self-check
      - name: Run contract tests
        run: pytest -q experiments/ril-anomaly-002/tests/test_contract.py
