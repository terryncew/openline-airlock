name: HERMES-LIVE-001 real worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hermes-live-001.yml"
      - "src/airlock/nightshift.py"

permissions:
  contents: read

concurrency:
  group: hermes-live-001-terminal-proof
  cancel-in-progress: false

jobs:
  live-proof:
    name: real Hermes through frozen Airlock
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HERMES_HOME: /tmp/hermes-live-001-home
      HERMES_INSTALL_DIR: /tmp/hermes-live-001-install
      HERMES_COMMIT: 29112bef099274229cadff79cdff7bf7b99c4b77
      HERMES_RELEASE: v2026.8.31
      HERMES_MODEL: gpt-5.6-sol

    steps:
      - name: Checkout exact merged run base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require the single delegated model credential
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::HERMES-LIVE-001 requires repository secret OPENAI_API_KEY."
            exit 2
          fi

      - name: Install pinned real Hermes
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          INSTALL_LOG="$RUNNER_TEMP/hermes-install.log"
          exec > >(tee "$INSTALL_LOG") 2>&1

          rm -rf "$HERMES_HOME" "$HERMES_INSTALL_DIR"
          mkdir -p "$HERMES_HOME" "$HERMES_INSTALL_DIR"

          # The prior run proved the unauthenticated Git smart-HTTP path can be
          # rate-limited (HTTP 429). Fetch the exact immutable commit archive through
          # GitHub's authenticated REST endpoint instead. The token exists only in
          # this install step and is never forwarded to the Airlock worker boundary.
          ARCHIVE="$RUNNER_TEMP/hermes-${HERMES_COMMIT}.tar.gz"
          curl --fail --location --silent --show-error             --retry 5 --retry-delay 2 --retry-all-errors             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_READ_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/NousResearch/hermes-agent/tarball/${HERMES_COMMIT}"             -o "$ARCHIVE"

          test -s "$ARCHIVE"
          tar -xzf "$ARCHIVE" --strip-components=1 -C "$HERMES_INSTALL_DIR"
          test -f "$HERMES_INSTALL_DIR/pyproject.toml"

          python -m venv "$HERMES_INSTALL_DIR/venv"
          "$HERMES_INSTALL_DIR/venv/bin/python" -m pip install             --disable-pip-version-check             --editable "$HERMES_INSTALL_DIR"

          HERMES_BIN="$HERMES_INSTALL_DIR/venv/bin/hermes"
          if [ ! -x "$HERMES_BIN" ]; then
            echo "::error::Pinned Hermes archive installed but no executable was found at $HERMES_BIN."
            exit 2
          fi

          sha256sum "$ARCHIVE" > "$RUNNER_TEMP/hermes-source-archive.sha256"
          printf '%s\n' "$HERMES_COMMIT" > "$RUNNER_TEMP/hermes-source-commit.txt"

          mkdir -p "$RUNNER_TEMP/hermes-bin"
          ln -sf "$HERMES_BIN" "$RUNNER_TEMP/hermes-bin/hermes"
          echo "$RUNNER_TEMP/hermes-bin" >> "$GITHUB_PATH"

      - name: Prepare isolated Hermes home
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" > "$HERMES_HOME/.env"

          cat > "$HERMES_HOME/config.yaml" <<EOF
          model:
            provider: openai-api
            default: ${HERMES_MODEL}
          terminal:
            backend: local
            cwd: "."
            timeout: 180
          approvals:
            mode: off
          agent:
            max_turns: 90
          EOF

          chmod 600 "$HERMES_HOME/.env" "$HERMES_HOME/config.yaml"

      - name: Verify real Hermes runtime before contact
        shell: bash
        run: |
          set -euo pipefail
          command -v hermes
          hermes --version || hermes version || true
          test "$(cat "$RUNNER_TEMP/hermes-source-commit.txt")" = "$HERMES_COMMIT"

          cat > "$RUNNER_TEMP/hermes-runtime.json" <<EOF
          {
            "schema": "airlock.hermes-live-001.runtime.v1",
            "hermes_release": "$HERMES_RELEASE",
            "hermes_commit": "$HERMES_COMMIT",
            "source_transport": "github-rest-commit-tarball",
            "model_provider": "openai-api",
            "model": "$HERMES_MODEL",
            "worker_forwarded_environment": ["HERMES_HOME"],
            "github_write_permission": false
          }
          EOF

      - name: Run frozen HERMES-LIVE-001
        id: proof
        shell: bash
        run: |
          set -o pipefail
          python .airlock/checks/hermes_live_001_run.py --expect-main-move             2>&1 | tee "$RUNNER_TEMP/hermes-live-001-console.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Collect terminal receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$RUNNER_TEMP/hermes-live-001-artifact"
          mkdir -p "$ARTIFACT_DIR"

          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "head_sha=${GITHUB_SHA}"
          } > "$ARTIFACT_DIR/run.txt"

          test -f "$RUNNER_TEMP/hermes-install.log" &&             cp "$RUNNER_TEMP/hermes-install.log" "$ARTIFACT_DIR/install.log" || true
          test -f "$RUNNER_TEMP/hermes-runtime.json" &&             cp "$RUNNER_TEMP/hermes-runtime.json" "$ARTIFACT_DIR/runtime.json" || true
          test -f "$RUNNER_TEMP/hermes-source-archive.sha256" &&             cp "$RUNNER_TEMP/hermes-source-archive.sha256" "$ARTIFACT_DIR/hermes-source-archive.sha256" || true
          test -f "$RUNNER_TEMP/hermes-source-commit.txt" &&             cp "$RUNNER_TEMP/hermes-source-commit.txt" "$ARTIFACT_DIR/hermes-source-commit.txt" || true
          test -f "$RUNNER_TEMP/hermes-live-001-console.log" &&             cp "$RUNNER_TEMP/hermes-live-001-console.log" "$ARTIFACT_DIR/console.log" || true

          REPORT="$(find .airlock/improvements/HERMES-LIVE-001 -type f -name report.json -print 2>/dev/null | sort | tail -1 || true)"
          if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then
            cp "$REPORT" "$ARTIFACT_DIR/report.json"
            sha256sum "$REPORT" > "$ARTIFACT_DIR/report.sha256"
          fi

          if [ -d ".airlock/improvements" ]; then
            mkdir -p "$ARTIFACT_DIR/improvements"
            cp -a .airlock/improvements/. "$ARTIFACT_DIR/improvements/"
          fi

      - name: Upload proof receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HERMES-LIVE-001-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hermes-live-001-artifact/
          if-no-files-found: error
          retention-days: 30
