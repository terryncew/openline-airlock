name: RSI-006-Q3 substrate-qualification gate

# Non-scientific gate. Installs pytest, runs the RSI-006-Q3 self-check and
# contract tests, and asserts the stage's frozen non-scientific properties:
# deterministic generation, the spec-bound operator set, single-site
# mutation, no researcher/model-access code path, frozen budgets/thresholds,
# the pre-observation feasibility guard, canonical record persistence, the
# Stage 1 / Stage 2 separation (environment receipt boundary, contact
# marker), and full launch observability.
#
# Stage 1 environment qualification runs here only against local fixture
# packages inside the contract tests. The full Stage 2 scientific run
# clones external repos and runs hundreds of mutant observations; it is
# local-only and NEVER runs in CI. This workflow performs no scientific
# contact and contains no scientific content. (This comment deliberately
# avoids naming the Stage 2 entry-point flag, so the assertion below that
# the flag never appears in this file stays meaningful.)

on:
  push:
    paths:
      - "experiments/rsi-006-q3-substrate-qualification/**"
      - ".github/workflows/rsi-006-q3-gate.yml"
  pull_request:
    paths:
      - "experiments/rsi-006-q3-substrate-qualification/**"
      - ".github/workflows/rsi-006-q3-gate.yml"

permissions:
  contents: read

jobs:
  rsi-006-q3-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install pytest

      - name: RSI-006-Q3 self-check (non-executing)
        run: |
          python experiments/rsi-006-q3-substrate-qualification/run_rsi_006_q3.py --self-check

      - name: Contract tests
        run: |
          python -m pytest experiments/rsi-006-q3-substrate-qualification/tests/ -q -p no:cacheprovider

      - name: Assert no scientific contact in CI
        run: |
          # The gate must never invoke the Stage 2 qualification flag. The
          # bracket trick keeps this grep from matching its own pattern text
          # (cf. the RSI-006-Q gate self-reference defect).
          ! grep -R -- "--qualif[y]" .github/workflows/rsi-006-q3-gate.yml
          # The stage modules expose no scientific-primary surface at all.
          ! grep -R "execute-primary" experiments/rsi-006-q3-substrate-qualification/perturb.py experiments/rsi-006-q3-substrate-qualification/observe.py experiments/rsi-006-q3-substrate-qualification/env_qualify.py experiments/rsi-006-q3-substrate-qualification/run_rsi_006_q3.py experiments/rsi-006-q3-substrate-qualification/contact.py
          ! grep -Ri "nightshift" experiments/rsi-006-q3-substrate-qualification/perturb.py experiments/rsi-006-q3-substrate-qualification/observe.py experiments/rsi-006-q3-substrate-qualification/env_qualify.py experiments/rsi-006-q3-substrate-qualification/run_rsi_006_q3.py experiments/rsi-006-q3-substrate-qualification/contact.py
          echo "gate is non-scientific: OK"
