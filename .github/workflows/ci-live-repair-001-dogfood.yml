name: AIRLOCK-CI-LIVE-REPAIR-001 live Hermes repair

on:
  workflow_run:
    workflows:
      - "AIRLOCK-CI-LIVE-REPAIR-001 expected code failure"
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-live-repair-001-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  live-repair:
    name: Recorder to one real Hermes Doctor attempt
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'dogfood/ci-live-repair-')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HERMES_HOME: /tmp/airlock-ci-live-repair-001-home
      HERMES_INSTALL_DIR: /tmp/airlock-ci-live-repair-001-hermes
      HERMES_COMMIT: 29112bef099274229cadff79cdff7bf7b99c4b77
      HERMES_RELEASE: v2026.8.31
      HERMES_MODEL: gpt-5.6-sol
      AIRLOCK_DOCTOR_BUDGET_USD: "1.00"

    steps:
      - name: Checkout exact failed execution SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install this Airlock commit
        run: python -m pip install .

      - name: Freeze dogfood-only receiver rules
        shell: bash
        run: |
          set -euo pipefail
          cp dogfood/ci-live-repair-001/config.json .airlock/config.json
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('.airlock/config.json').read_text())
          assert cfg['schema'] == 'airlock.config.v1'
          assert cfg['providers']['hermes']['pass_env'] == ['HERMES_HOME']
          assert cfg['verification']['test_commands']
          assert 'experiments/ci-code-path-001/fixture/tests/**' in cfg['protected_paths']
          PY

      - name: Require the single delegated model credential
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::CI-LIVE-REPAIR-001 requires repository secret OPENAI_API_KEY."
            exit 2
          fi

      - name: Install pinned real Hermes
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          INSTALL_LOG="$RUNNER_TEMP/hermes-install.log"
          exec > >(tee "$INSTALL_LOG") 2>&1

          rm -rf "$HERMES_HOME" "$HERMES_INSTALL_DIR"
          mkdir -p "$HERMES_HOME" "$HERMES_INSTALL_DIR"

          ARCHIVE="$RUNNER_TEMP/hermes-${HERMES_COMMIT}.tar.gz"
          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_READ_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/NousResearch/hermes-agent/tarball/${HERMES_COMMIT}" \
            -o "$ARCHIVE"

          test -s "$ARCHIVE"
          tar -xzf "$ARCHIVE" --strip-components=1 -C "$HERMES_INSTALL_DIR"
          test -f "$HERMES_INSTALL_DIR/pyproject.toml"

          python -m venv "$HERMES_INSTALL_DIR/venv"
          "$HERMES_INSTALL_DIR/venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --editable "$HERMES_INSTALL_DIR"

          HERMES_BIN="$HERMES_INSTALL_DIR/venv/bin/hermes"
          test -x "$HERMES_BIN"
          sha256sum "$ARCHIVE" > "$RUNNER_TEMP/hermes-source-archive.sha256"
          printf '%s\n' "$HERMES_COMMIT" > "$RUNNER_TEMP/hermes-source-commit.txt"
          mkdir -p "$RUNNER_TEMP/hermes-bin"
          ln -sf "$HERMES_BIN" "$RUNNER_TEMP/hermes-bin/hermes"
          echo "$RUNNER_TEMP/hermes-bin" >> "$GITHUB_PATH"

      - name: Prepare isolated Hermes home
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" > "$HERMES_HOME/.env"
          cat > "$HERMES_HOME/config.yaml" <<EOF
          model:
            provider: openai-api
            default: ${HERMES_MODEL}
          terminal:
            backend: local
            cwd: "."
            timeout: 180
          approvals:
            mode: off
          agent:
            max_turns: 60
          EOF
          chmod 600 "$HERMES_HOME/.env" "$HERMES_HOME/config.yaml"

      - name: Verify pinned worker before contact
        shell: bash
        run: |
          set -euo pipefail
          command -v hermes
          test "$(cat "$RUNNER_TEMP/hermes-source-commit.txt")" = "$HERMES_COMMIT"
          hermes --version || hermes version || true

      - name: Run the merged one-command CI repair path
        id: repair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -o pipefail
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}"
          airlock nightshift \
            --ci "$RUN_URL" \
            --repair-ci \
            --budget "$AIRLOCK_DOCTOR_BUDGET_USD" \
            --repo . \
            2>&1 | tee "$RUNNER_TEMP/ci-live-repair-console.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Independently verify admitted candidate
        id: verify
        if: ${{ steps.repair.outcome == 'success' }}
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$RUNNER_TEMP/ci-live-repair-001-artifact"
          python scripts/verify_ci_live_repair_001.py \
            --repo . \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --artifact-dir "$ARTIFACT_DIR" \
            2>&1 | tee "$RUNNER_TEMP/ci-live-repair-verifier.log"

      - name: Collect live proof artifacts
        if: always()
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$RUNNER_TEMP/ci-live-repair-001-artifact"
          mkdir -p "$ARTIFACT_DIR"
          {
            echo "source_run_id=${SOURCE_RUN_ID}"
            echo "source_run_attempt=${SOURCE_RUN_ATTEMPT}"
            echo "source_head_sha=${SOURCE_HEAD_SHA}"
            echo "consumer_run_id=${GITHUB_RUN_ID}"
            echo "consumer_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "github_write_permission=false"
          } > "$ARTIFACT_DIR/run.txt"

          test -f "$RUNNER_TEMP/hermes-install.log" && cp "$RUNNER_TEMP/hermes-install.log" "$ARTIFACT_DIR/hermes-install.log" || true
          test -f "$RUNNER_TEMP/hermes-source-archive.sha256" && cp "$RUNNER_TEMP/hermes-source-archive.sha256" "$ARTIFACT_DIR/hermes-source-archive.sha256" || true
          test -f "$RUNNER_TEMP/hermes-source-commit.txt" && cp "$RUNNER_TEMP/hermes-source-commit.txt" "$ARTIFACT_DIR/hermes-source-commit.txt" || true
          test -f "$RUNNER_TEMP/ci-live-repair-console.log" && cp "$RUNNER_TEMP/ci-live-repair-console.log" "$ARTIFACT_DIR/console.log" || true
          test -f "$RUNNER_TEMP/ci-live-repair-verifier.log" && cp "$RUNNER_TEMP/ci-live-repair-verifier.log" "$ARTIFACT_DIR/verifier.log" || true

      - name: Upload live proof receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CI-LIVE-REPAIR-001-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/ci-live-repair-001-artifact/
          if-no-files-found: error
          retention-days: 30
