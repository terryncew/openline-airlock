name: AIRLOCK-SELF-001

on:
  pull_request:
    paths:
      - ".airlock/self-001/**"
      - "experiments/airlock-self-001/**"
      - ".github/workflows/airlock-self-001.yml"
  workflow_dispatch:
    inputs:
      agents:
        description: "Hermes attempts per arm"
        required: false
        default: "2"
      budget_usd:
        description: "Optional total provider budget hint across both arms"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: airlock-self-001
  cancel-in-progress: false

jobs:
  prereg-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Airlock
        run: python -m pip install --disable-pip-version-check .
      - name: Full repository baseline
        run: python -m unittest discover -s tests -v
      - name: Frozen evaluator self-test
        run: python .airlock/self-001/evaluator.py --self-test
      - name: Baseline protected checks
        run: python .airlock/self-001/protected_checks.py

  live:
    if: github.event_name == 'workflow_dispatch'
    needs: prereg-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HERMES_HOME: /tmp/airlock-self-001-home
      HERMES_INSTALL_DIR: /tmp/airlock-self-001-hermes
      HERMES_COMMIT: 29112bef099274229cadff79cdff7bf7b99c4b77
      HERMES_MODEL: gpt-5.6-sol

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require delegated model credential
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}" || { echo "::error::AIRLOCK-SELF-001 requires OPENAI_API_KEY"; exit 2; }

      - name: Install Airlock
        run: python -m pip install --disable-pip-version-check .

      - name: Cache pinned Hermes source archive
        id: hermes-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hermes-source/${{ env.HERMES_COMMIT }}.tar.gz
          key: hermes-source-${{ runner.os }}-${{ env.HERMES_COMMIT }}

      - name: Install pinned Hermes
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf "$HERMES_HOME" "$HERMES_INSTALL_DIR"
          mkdir -p "$HERMES_HOME" "$HERMES_INSTALL_DIR" "$RUNNER_TEMP/hermes-source"

          ARCHIVE="$RUNNER_TEMP/hermes-source/${HERMES_COMMIT}.tar.gz"
          SOURCE_TRANSPORT="actions-cache"

          archive_ok() {
            test -s "$ARCHIVE" && tar -tzf "$ARCHIVE" >/dev/null 2>&1
          }

          if ! archive_ok; then
            rm -f "$ARCHIVE"
            SOURCE_TRANSPORT="github-codeload"

            # codeload serves the immutable commit archive without consuming the
            # GitHub REST API rate bucket that returned HTTP 429 in run #2.
            if ! curl --fail --location --silent --show-error \
              --retry 5 --retry-delay 5 --retry-all-errors \
              "https://codeload.github.com/NousResearch/hermes-agent/tar.gz/${HERMES_COMMIT}" \
              -o "$ARCHIVE"; then
              rm -f "$ARCHIVE"
            fi
          fi

          if ! archive_ok; then
            SOURCE_TRANSPORT="github-rest-fallback"

            # Keep the authenticated REST route only as a fallback. A 429 here
            # is an environment/setup failure, never an AIRLOCK-SELF-001 result.
            curl --fail --location --silent --show-error \
              --retry 6 --retry-delay 10 --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_READ_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/NousResearch/hermes-agent/tarball/${HERMES_COMMIT}" \
              -o "$ARCHIVE"
          fi

          if ! archive_ok; then
            echo "::error::Could not obtain a valid archive for pinned Hermes commit ${HERMES_COMMIT}."
            exit 2
          fi

          sha256sum "$ARCHIVE" > "$RUNNER_TEMP/hermes-source-archive.sha256"
          printf '%s\n' "$HERMES_COMMIT" > "$RUNNER_TEMP/hermes-source-commit.txt"
          printf '%s\n' "$SOURCE_TRANSPORT" > "$RUNNER_TEMP/hermes-source-transport.txt"

          tar -xzf "$ARCHIVE" --strip-components=1 -C "$HERMES_INSTALL_DIR"
          test -f "$HERMES_INSTALL_DIR/pyproject.toml"

          python -m venv "$HERMES_INSTALL_DIR/venv"
          "$HERMES_INSTALL_DIR/venv/bin/python" -m pip install \
            --disable-pip-version-check --editable "$HERMES_INSTALL_DIR"

          HERMES_BIN="$HERMES_INSTALL_DIR/venv/bin/hermes"
          test -x "$HERMES_BIN"

          mkdir -p "$RUNNER_TEMP/hermes-bin"
          ln -sf "$HERMES_BIN" "$RUNNER_TEMP/hermes-bin/hermes"
          echo "$RUNNER_TEMP/hermes-bin" >> "$GITHUB_PATH"

      - name: Prepare isolated Hermes home
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" > "$HERMES_HOME/.env"
          cat > "$HERMES_HOME/config.yaml" <<EOF
          model:
            provider: openai-api
            default: ${HERMES_MODEL}
          terminal:
            backend: local
            cwd: "."
            timeout: 180
          approvals:
            mode: off
          agent:
            max_turns: 90
          EOF
          chmod 600 "$HERMES_HOME/.env" "$HERMES_HOME/config.yaml"

      - name: Verify pinned Hermes runtime before worker contact
        shell: bash
        run: |
          set -euo pipefail
          command -v hermes
          test "$(cat "$RUNNER_TEMP/hermes-source-commit.txt")" = "$HERMES_COMMIT"
          test -s "$RUNNER_TEMP/hermes-source-archive.sha256"
          test -s "$RUNNER_TEMP/hermes-source-transport.txt"

      - name: Run AIRLOCK-SELF-001
        id: self001
        shell: bash
        env:
          AGENTS: ${{ inputs.agents }}
          BUDGET: ${{ inputs.budget_usd }}
        run: |
          set -o pipefail
          args=(python experiments/airlock-self-001/run_self_001.py --agents "${AGENTS:-2}" --model hermes)
          if [ -n "${BUDGET:-}" ]; then
            args+=(--budget "$BUDGET")
          fi
          "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/airlock-self-001.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          # Codes 0 and 3 are completed scientific results. Infrastructure
          # failures are separated in the final workflow step after receipts
          # and the human-readable summary have been preserved.
          exit 0

      - name: Collect receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="$RUNNER_TEMP/airlock-self-001-artifact"
          mkdir -p "$ARTIFACT"
          cp "$RUNNER_TEMP/airlock-self-001.log" "$ARTIFACT/console.log" 2>/dev/null || true
          cp "$RUNNER_TEMP/hermes-source-archive.sha256" "$ARTIFACT/hermes-source-archive.sha256" 2>/dev/null || true
          cp "$RUNNER_TEMP/hermes-source-commit.txt" "$ARTIFACT/hermes-source-commit.txt" 2>/dev/null || true
          cp "$RUNNER_TEMP/hermes-source-transport.txt" "$ARTIFACT/hermes-source-transport.txt" 2>/dev/null || true
          if [ -d ".airlock/self-001-results" ]; then
            cp -a .airlock/self-001-results "$ARTIFACT/results"
          fi
          if [ -d ".airlock/runs" ]; then
            cp -a .airlock/runs "$ARTIFACT/airlock-runs"
          fi
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "head_sha=${GITHUB_SHA}"
            echo "hermes_commit=${HERMES_COMMIT}"
            echo "model=${HERMES_MODEL}"
            echo "experiment_exit_code=${{ steps.self001.outputs.exit_code }}"
          } > "$ARTIFACT/run.txt"

      - name: Publish experiment summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$(find .airlock/self-001-results -type f -name report.json -print 2>/dev/null | sort | tail -1 || true)"
          {
            echo "# AIRLOCK-SELF-001"
            echo
            if [ -z "$REPORT" ] || [ ! -f "$REPORT" ]; then
              echo "**Infrastructure:** FAILED — no result receipt was produced."
            else
              echo "**Conclusion:** \`$(jq -r '.conclusion' "$REPORT")\`"
              echo
              echo "**Valid experiment:** \`$(jq -r '.valid_experiment' "$REPORT")\`"
              echo
              echo "**Claim earned:** \`$(jq -r '.earned' "$REPORT")\`"
              echo
              echo "**Autonomous arm:** \`$(jq -r '.autonomous.selection.status' "$REPORT")\`"
              echo
              echo "**Directed control:** \`$(jq -r '.maintainer_directed.selection.status' "$REPORT")\`"
              echo
              echo "$(jq -r '.interpretation' "$REPORT")"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then
            if [ "$(jq -r '.valid_experiment' "$REPORT")" != "true" ]; then
              echo "::error::AIRLOCK-SELF-001 did not run; inspect the infrastructure fields in the receipt."
            elif [ "$(jq -r '.earned' "$REPORT")" = "true" ]; then
              echo "::notice::AIRLOCK-SELF-001 earned its preregistered claim."
            else
              echo "::notice::AIRLOCK-SELF-001 completed validly and did not earn its preregistered claim."
            fi
          fi

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AIRLOCK-SELF-001-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/airlock-self-001-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce infrastructure validity
        if: always()
        shell: bash
        env:
          EXPERIMENT_EXIT: ${{ steps.self001.outputs.exit_code }}
        run: |
          set -euo pipefail
          case "${EXPERIMENT_EXIT:-missing}" in
            0|3)
              # A valid negative result is evidence, not a broken workflow.
              exit 0
              ;;
            2)
              echo "::error::AIRLOCK-SELF-001 infrastructure failed before the claim could be tested."
              exit 2
              ;;
            *)
              echo "::error::AIRLOCK-SELF-001 runner failed with exit ${EXPERIMENT_EXIT:-missing}."
              exit 1
              ;;
          esac
