name: RIL-RELAY-002 egress-bound deterministic relay
on:
  pull_request:
    paths:
      - 'experiments/ril-relay-002/**'
      - 'proofs/ril-relay-001/**'
      - '.github/workflows/ril-relay-002.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python experiments/ril-relay-002/verify_repo.py
      - run: python experiments/ril-relay-002/protected/relay_driver.py self-check
      - run: pytest -q experiments/ril-relay-002/tests
