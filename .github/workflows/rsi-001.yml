name: RSI-001 earned inheritance

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/rsi-001/**"
      - ".github/workflows/rsi-001.yml"
  pull_request:
    paths:
      - "experiments/rsi-001/**"
      - ".github/workflows/rsi-001.yml"

permissions:
  contents: read

jobs:
  rsi-001:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Airlock and exact Verified Memory dependency
        run: |
          python -m pip install .
          python -m pip install "git+https://github.com/terryncew/openline-verified-memory.git@454c5a3b28f2b7da673f6acf0007fc1d7b6f4d8e"

      - name: Run RSI-001
        run: |
          python experiments/rsi-001/run_rsi_001.py --output "$RUNNER_TEMP/RSI_001_RESULT.json"

      - name: Require frozen verdict and boundaries
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "RSI_001_RESULT.json"
          r = json.loads(p.read_text())
          assert r["verdict"] == "PASS_RSI_001_EARNED_INHERITANCE", r
          assert r["states"] == {
              "after_selection_before_installation": "candidate",
              "after_restart_exact_installation": "inherited",
              "after_support_loss_reopen": "questioned",
          }, r
          assert r["next_generation_established_counts"] == {
              "before_installation": 0,
              "after_installation": 1,
              "after_reopen": 0,
          }, r
          assert r["wrong_install_negative_control_rejected"] is True, r
          assert r["generator_frozen"] is True, r
          assert r["installed_state_unchanged_by_reopen"] is True, r
          assert r["verified_memory_commit"] == "454c5a3b28f2b7da673f6acf0007fc1d7b6f4d8e", r
          print(json.dumps(r, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RSI-001-result
          path: ${{ runner.temp }}/RSI_001_RESULT.json
          if-no-files-found: error
