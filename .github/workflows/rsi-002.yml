name: RSI-002 generator gate

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/rsi-002-generator-gate
    paths:
      - ".github/workflows/rsi-002.yml"
      - "experiments/rsi-002/**"

permissions:
  contents: read

jobs:
  rsi-002:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact Airlock branch source
        run: python -m pip install -e .

      - name: Verify recovered RGG-002 evidence and synthetic power
        run: python experiments/rsi-002/run_rsi_002.py --self-check

      - name: Run RSI-002 Generator Gate
        run: python experiments/rsi-002/run_rsi_002.py --output "${{ runner.temp }}/RSI_002_RESULT.json"

      - name: Require frozen verdict and boundaries
        env:
          RESULT: ${{ runner.temp }}/RSI_002_RESULT.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RESULT"])
          r = json.loads(p.read_text())
          assert r["verdict"] == "PASS_RSI_002_GENERATOR_GATE", r
          assert r["scientific_standing"] == "CONTROLLED_SYNTHETIC_PRIMARY"
          assert r["historical_rgg002"]["result_sha256"] == "53ac1f6b0a3d0677c8f798b46634bbe36fd2a1c27a1cd6a28656c97d9252806f"
          assert r["historical_rgg002"]["verdict"] == "GENERATOR_GATE_SUPPORTED_WITH_INDEPENDENT_PROGRESS"
          assert r["candidate_seal"]["holdout_queries_before_seal"] == 0
          assert r["terminal_holdout"]["feedback_returned_to_candidate_search"] is False
          assert r["terminal_holdout"]["attempts_per_task"] == 1
          assert r["scores"]["candidate"]["success_rate"] >= 0.95
          assert r["scores"]["candidate_advantage"] >= 0.50
          assert r["protected_evaluator_cheat"]["blocked"] is True
          assert r["checks"]["regressive_policy_fails_gate"] is True
          assert r["execution_authority"] == "NONE"
          assert r["policy_authority"] == "NONE"
          assert r["installed_production_state_changed"] is False
          print(json.dumps({
              "verdict": r["verdict"],
              "baseline": r["scores"]["baseline"]["success_rate"],
              "candidate": r["scores"]["candidate"]["success_rate"],
              "advantage": r["scores"]["candidate_advantage"],
              "cheat_blocked": r["protected_evaluator_cheat"]["blocked"],
          }, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RSI-002-result
          path: ${{ runner.temp }}/RSI_002_RESULT.json
          if-no-files-found: error
