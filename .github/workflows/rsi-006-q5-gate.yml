name: RSI-006-Q5 durability-ledger gate

# Non-scientific gate. Installs pytest, runs the RSI-006-Q5 self-check
# and the fixture/integration tests, and nothing else: no real
# repositories, no Stage 1, no substrate contact. The fixture driver
# runs trivial python -c subprocesses (never pytest on real mutants);
# termination is injected as os._exit(1) and resume happens from the
# same durable work directory. Triggers only when the Q5 experiment
# directory or this workflow changes.

on:
  push:
    paths:
      - "experiments/rsi-006-q5-durable-substrate-qualification/**"
      - ".github/workflows/rsi-006-q5-gate.yml"
  pull_request:
    paths:
      - "experiments/rsi-006-q5-durable-substrate-qualification/**"
      - ".github/workflows/rsi-006-q5-gate.yml"

permissions:
  contents: read

jobs:
  rsi-006-q5-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install pytest

      - name: RSI-006-Q5 self-check (non-executing)
        run: |
          python experiments/rsi-006-q5-durable-substrate-qualification/self_check.py

      - name: Durability-ledger contract tests
        run: |
          python -m pytest experiments/rsi-006-q5-durable-substrate-qualification/tests/ -q -p no:cacheprovider
