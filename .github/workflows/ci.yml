name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python scripts/verify_v030_release.py
      - run: python -m unittest discover -s tests -v

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip wheel . --no-deps -w dist
      - run: python -m venv /tmp/airlock-venv
      - run: /tmp/airlock-venv/bin/pip install --no-index dist/*.whl
      - run: test "$(/tmp/airlock-venv/bin/airlock --version)" = "0.3.0"
      - run: /tmp/airlock-venv/bin/airlock --help
      - run: /tmp/airlock-venv/bin/airlock review --help
      - run: /tmp/airlock-venv/bin/airlock-submit --version

  actions-runtime:
    name: Actions runtime integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: docker version
      - run: python scripts/run_actions_runtime_selftest.py --out airlock-actions-selftest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airlock-actions-runtime
          path: airlock-actions-selftest/
          if-no-files-found: error
          retention-days: 30
