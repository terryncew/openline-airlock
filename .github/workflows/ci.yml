name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python scripts/verify_v030_release.py
      - run: python scripts/verify_improvement_release.py
      - run: python scripts/verify_nightshift_release.py
      - run: python -m unittest discover -s tests -v

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip wheel . --no-deps -w dist
      - run: python -m venv /tmp/airlock-venv
      - run: /tmp/airlock-venv/bin/pip install --no-index dist/*.whl
      - run: test "$(/tmp/airlock-venv/bin/airlock --version)" = "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
      - run: /tmp/airlock-venv/bin/airlock --help
      - run: /tmp/airlock-venv/bin/airlock improve --help
      - run: /tmp/airlock-venv/bin/airlock nightshift --help
      - run: /tmp/airlock-venv/bin/airlock review --help
      - run: /tmp/airlock-venv/bin/airlock-submit --version

  actions-runtime:
    name: Actions runtime integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - id: reachability
        # The reachability proof runs the repository's full unittest suite eight
        # times across isolated candidate clones. Some tests create disposable
        # Git repositories. Git's detached auto-maintenance can outlive a short
        # test and race TemporaryDirectory cleanup, producing a false regression
        # even though the candidate is correct. Disable only automatic background
        # maintenance for this stress proof; all evaluator checks remain intact.
        env:
          GIT_CONFIG_COUNT: "4"
          GIT_CONFIG_KEY_0: maintenance.auto
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: maintenance.autoDetach
          GIT_CONFIG_VALUE_1: "false"
          GIT_CONFIG_KEY_2: gc.auto
          GIT_CONFIG_VALUE_2: "0"
          GIT_CONFIG_KEY_3: gc.autoDetach
          GIT_CONFIG_VALUE_3: "false"
        run: python scripts/verify_unattended_reachability.py --out airlock-unattended-reachability.json
      - name: Publish reachability failure diagnostics
        if: ${{ always() && steps.reachability.outcome == 'failure' }}
        shell: bash
        run: |
          {
            echo "### Unattended reachability failure"
            echo
            echo '```json'
            if test -f airlock-unattended-reachability.json; then
              cat airlock-unattended-reachability.json
            else
              echo '{"error":"reachability report was not written"}'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.reachability.outcome != 'skipped' }}
        with:
          name: airlock-unattended-reachability
          path: airlock-unattended-reachability.json
          if-no-files-found: warn
          retention-days: 30
      - run: docker version
        if: ${{ always() && steps.reachability.outcome != 'skipped' }}
      - id: actions_selftest
        if: ${{ always() && steps.reachability.outcome != 'skipped' }}
        run: python scripts/run_actions_runtime_selftest.py --out airlock-actions-selftest
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.actions_selftest.outcome != 'skipped' }}
        with:
          name: airlock-actions-runtime
          path: airlock-actions-selftest/
          if-no-files-found: error
          retention-days: 30
