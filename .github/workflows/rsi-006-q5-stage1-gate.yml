name: RSI-006-Q5 Stage 1 qualifier gate

# Non-scientific gate for the RSI-006-Q5 Stage 1 environment-qualifier
# mechanism (pre-contact change only). Runs the Stage 1 self-check and
# the fixture-only Stage 1 contract tests, and asserts the production
# boundary: the execution surface is complete (run_rsi_006_q5.py
# present and listed, manifest validates), Stage 1 has not run (no
# production receipt), and CI never invokes arming or qualification.
#
# Triggers ONLY on the Stage 1 mechanism files -- the qualifier, the
# receipt module, the execution manifest, the Stage 1 spec, the Stage 1
# tests, and this workflow itself. Changes to the Q5 durability-ledger
# files keep running under rsi-006-q5-gate.yml; the runner mechanism
# runs under rsi-006-q5-runner-gate.yml; this gate does not replace
# either.
#
# No Stage 1 run happens here: the contract tests qualify tiny local
# fixture Git repositories only. No real repositories are cloned, no
# mutants are generated, no scientific contact occurs. (This comment
# deliberately avoids naming the production entry-point flag, so the
# assertion below that the flag never appears in this file stays
# meaningful.)

on:
  push:
    paths:
      - "experiments/rsi-006-q5-durable-substrate-qualification/stage1/**"
      - "experiments/rsi-006-q5-durable-substrate-qualification/environment_receipt.py"
      - "experiments/rsi-006-q5-durable-substrate-qualification/execution_manifest.json"
      - "experiments/rsi-006-q5-durable-substrate-qualification/q5_adapter.py"
      - "experiments/rsi-006-q5-durable-substrate-qualification/tests/test_stage1_qualifier.py"
      - "experiments/rsi-006-q5-durable-substrate-qualification/RSI_006_Q5_SPEC.md"
      - ".github/workflows/rsi-006-q5-stage1-gate.yml"
  pull_request:
    paths:
      - "experiments/rsi-006-q5-durable-substrate-qualification/stage1/**"
      - "experiments/rsi-006-q5-durable-substrate-qualification/environment_receipt.py"
      - "experiments/rsi-006-q5-durable-substrate-qualification/execution_manifest.json"
      - "experiments/rsi-006-q5-durable-substrate-qualification/q5_adapter.py"
      - "experiments/rsi-006-q5-durable-substrate-qualification/tests/test_stage1_qualifier.py"
      - "experiments/rsi-006-q5-durable-substrate-qualification/RSI_006_Q5_SPEC.md"
      - ".github/workflows/rsi-006-q5-stage1-gate.yml"

permissions:
  contents: read

jobs:
  rsi-006-q5-stage1-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Stage 1 self-check (non-executing)
        run: |
          python experiments/rsi-006-q5-durable-substrate-qualification/stage1/self_check.py

      - name: Stage 1 qualifier contract tests (fixtures only)
        run: |
          python -m pytest experiments/rsi-006-q5-durable-substrate-qualification/tests/test_stage1_qualifier.py -q -p no:cacheprovider

      - name: Assert production boundary holds and CI stays non-scientific
        run: |
          # The execution surface must be complete: the runner is present
          # and listed, and the manifest validates. Completeness is not
          # authorization: no production receipt may exist.
          python - <<'EOF'
          import json, os
          m = json.load(open("experiments/rsi-006-q5-durable-substrate-qualification/execution_manifest.json"))
          runner = "experiments/rsi-006-q5-durable-substrate-qualification/run_rsi_006_q5.py"
          assert runner in m["code_files"], "manifest lost the required runner binding"
          assert os.path.exists(runner), "runner listed but file absent"
          assert "does not exist yet" not in m.get("note", ""), \
              "manifest note still claims the runner is absent"
          print("execution surface complete: OK")
          EOF
          # The gate must never invoke the production qualification flag.
          # The bracket trick keeps this grep from matching its own
          # pattern text.
          ! grep -R -- "--qualif[y]-env" .github/workflows/rsi-006-q5-stage1-gate.yml
          echo "gate is non-scientific: OK"
